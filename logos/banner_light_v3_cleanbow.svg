<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" rx="12" fill="#ffffff"/>
  <rect width="900" height="260" rx="12" fill="none" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Logo: Present with bow sitting cleanly on top -->
  <g transform="translate(50, 30)">
    <!-- Circle background -->
    <circle cx="100" cy="100" r="94" fill="#1a1a1a"/>

    <!-- Gift box body -->
    <rect x="50" y="82" width="100" height="75" rx="3" fill="#1a1a1a" stroke="#E8600A" stroke-width="4"/>

    <!-- Gift box lid -->
    <rect x="44" y="66" width="112" height="20" rx="3" fill="#1a1a1a" stroke="#E8600A" stroke-width="4"/>

    <!-- Vertical ribbon -->
    <rect x="92" y="66" width="16" height="91" fill="#E8600A" rx="1"/>

    <!-- Horizontal ribbon -->
    <rect x="44" y="102" width="112" height="16" fill="#E8600A" rx="1"/>

    <!-- Bow - sits on top of lid, no overlap with box -->
    <!-- Left loop -->
    <path d="M 100,62 C 88,58 68,42 72,32 C 76,22 90,26 96,38 C 98,42 100,50 100,62" fill="#E8600A" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Right loop -->
    <path d="M 100,62 C 112,58 132,42 128,32 C 124,22 110,26 104,38 C 102,42 100,50 100,62" fill="#E8600A" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Left tail -->
    <path d="M 100,64 C 90,58 76,56 70,48" fill="none" stroke="#E8600A" stroke-width="4" stroke-linecap="round"/>
    <!-- Right tail -->
    <path d="M 100,64 C 110,58 124,56 130,48" fill="none" stroke="#E8600A" stroke-width="4" stroke-linecap="round"/>
    <!-- Center knot -->
    <circle cx="100" cy="62" r="5" fill="#cc5208"/>

    <!-- Circle border -->
    <circle cx="100" cy="100" r="94" stroke="#E8600A" stroke-width="2" fill="none"/>
  </g>

  <!-- Project name -->
  <text x="290" y="80" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="600" font-size="36" fill="#1a1a1a" letter-spacing="1">Houdini Remote Render</text>

  <!-- Tagline line 1 -->
  <text x="290" y="140" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="600" font-size="28" fill="#E8600A">Package it. Ship it. Render it.</text>

  <!-- Tagline line 2 -->
  <text x="290" y="185" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="300" font-size="20" fill="#555555">Portable render packages. No farm required.</text>

  <!-- Subtle bottom accent line -->
  <rect x="290" y="210" width="120" height="2" rx="1" fill="#E8600A" opacity="0.6"/>
</svg>

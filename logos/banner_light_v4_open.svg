<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" rx="12" fill="#ffffff"/>
  <rect width="900" height="260" rx="12" fill="none" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Logo: Present with lid open and action lines -->
  <g transform="translate(50, 30)">
    <!-- Circle background -->
    <circle cx="100" cy="100" r="94" fill="#1a1a1a"/>

    <!-- Gift box body -->
    <rect x="50" y="90" width="100" height="70" rx="3" fill="#1a1a1a" stroke="#E8600A" stroke-width="4"/>

    <!-- Vertical ribbon on body -->
    <rect x="92" y="90" width="16" height="70" fill="#E8600A" rx="1"/>

    <!-- Horizontal ribbon on body -->
    <rect x="50" y="112" width="100" height="16" fill="#E8600A" rx="1"/>

    <!-- Lid - tilted open (rotated back) -->
    <g transform="rotate(-25 44 82)">
      <rect x="44" y="72" width="112" height="18" rx="3" fill="#2a2a2a" stroke="#E8600A" stroke-width="3.5"/>
      <!-- Ribbon on lid -->
      <rect x="92" y="72" width="16" height="18" fill="#E8600A" rx="1"/>
    </g>

    <!-- Action lines / energy bursts coming out -->
    <!-- Center burst -->
    <line x1="100" y1="82" x2="100" y2="42" stroke="#E8600A" stroke-width="3" stroke-linecap="round"/>
    <!-- Left-center -->
    <line x1="88" y1="84" x2="78" y2="46" stroke="#E8600A" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right-center -->
    <line x1="112" y1="84" x2="122" y2="46" stroke="#E8600A" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Far left -->
    <line x1="76" y1="86" x2="58" y2="54" stroke="#E8600A" stroke-width="2" stroke-linecap="round"/>
    <!-- Far right -->
    <line x1="124" y1="86" x2="142" y2="54" stroke="#E8600A" stroke-width="2" stroke-linecap="round"/>

    <!-- Small dots/sparkles -->
    <circle cx="100" cy="36" r="3" fill="#E8600A"/>
    <circle cx="74" cy="42" r="2.5" fill="#E8600A"/>
    <circle cx="126" cy="42" r="2.5" fill="#E8600A"/>
    <circle cx="55" cy="48" r="2" fill="#E8600A" opacity="0.7"/>
    <circle cx="145" cy="48" r="2" fill="#E8600A" opacity="0.7"/>

    <!-- Circle border -->
    <circle cx="100" cy="100" r="94" stroke="#E8600A" stroke-width="2" fill="none"/>
  </g>

  <!-- Project name -->
  <text x="290" y="80" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="600" font-size="36" fill="#1a1a1a" letter-spacing="1">Houdini Remote Render</text>

  <!-- Tagline line 1 -->
  <text x="290" y="140" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="600" font-size="28" fill="#E8600A">Package it. Ship it. Render it.</text>

  <!-- Tagline line 2 -->
  <text x="290" y="185" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="300" font-size="20" fill="#555555">Portable render packages. No farm required.</text>

  <!-- Subtle bottom accent line -->
  <rect x="290" y="210" width="120" height="2" rx="1" fill="#E8600A" opacity="0.6"/>
</svg>
